<!DOCTYPE html>
<html lang="en" class="scroll-smooth">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{{ title }} — Project · Infrastructure · IT · Outsourcing · Advisory</title>
    <meta name="description" content="{{ description }}">
    
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    
    <!-- Alpine.js -->
    <script defer src="https://cdn.jsdelivr.net/npm/alpinejs@3.x.x/dist/cdn.min.js"></script>
    
    <!-- GSAP -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.2/gsap.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.2/ScrollTrigger.min.js"></script>
    
    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
    
    <!-- Custom Tailwind Config -->
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        background: {
                            DEFAULT: '#0A0A0F',
                            secondary: '#12121A',
                            elevated: '#1A1A25',
                        },
                        accent: {
                            DEFAULT: '#6366F1',
                            secondary: '#A78BFA',
                        },
                    },
                    fontFamily: {
                        sans: ['Inter', 'system-ui', 'sans-serif'],
                        mono: ['JetBrains Mono', 'monospace'],
                    },
                }
            }
        }
    </script>
    
    <style>
        body {
            background-color: #0A0A0F;
            color: #FFFFFF;
            font-family: 'Inter', system-ui, sans-serif;
        }
        
        /* ============================================
           GLOW CURSOR EFFECT (follows real mouse)
           ============================================ */
        
        .cursor-glow {
            position: fixed;
            top: 0;
            left: 0;
            width: 300px;
            height: 300px;
            border-radius: 50%;
            background: radial-gradient(circle, rgba(99, 102, 241, 0.15) 0%, rgba(99, 102, 241, 0.05) 40%, transparent 70%);
            pointer-events: none;
            z-index: 0;
            will-change: transform;
            margin-left: -150px;
            margin-top: -150px;
        }
        
        /* Hide glow on mobile */
        @media (max-width: 767px) {
            .cursor-glow { display: none !important; }
        }
        
        /* ============================================
           GRADIENT TEXT
           ============================================ */
        .gradient-text {
            background: linear-gradient(90deg, #6366F1, #A78BFA, #EC4899);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
        }
        
        /* ============================================
           GLASSMORPHISM
           ============================================ */
        .glass {
            background: rgba(26, 26, 37, 0.6);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            border: 1px solid rgba(255, 255, 255, 0.08);
        }
        
        /* ============================================
           MARQUEE
           ============================================ */
        .marquee-track {
            display: flex;
            width: max-content;
            animation: marquee 40s linear infinite;
        }
        
        .marquee-track:hover {
            animation-play-state: paused;
        }
        
        @keyframes marquee {
            0% { transform: translateX(0); }
            100% { transform: translateX(-50%); }
        }
        
        /* ============================================
           SCROLLBAR
           ============================================ */
        ::-webkit-scrollbar {
            width: 8px;
        }
        ::-webkit-scrollbar-track {
            background: #0A0A0F;
        }
        ::-webkit-scrollbar-thumb {
            background: #1A1A25;
            border-radius: 4px;
        }
        ::-webkit-scrollbar-thumb:hover {
            background: #6366F1;
        }
    </style>
    
    {% block extra_css %}{% endblock %}
</head>
<body x-data="{ mobileMenuOpen: false }">
    
    <!-- Glow effect that follows your real mouse -->
    <div class="cursor-glow" id="cursorGlow"></div>
    
    <!-- Navigation -->
    {% include 'includes/navbar.html' %}
    
    <!-- Main Content -->
    <main>
        {% block content %}{% endblock %}
    </main>
    
    <!-- Footer -->
    {% include 'includes/footer.html' %}
    
    <!-- ============================================
         SMOOTH GLOW FOLLOW SCRIPT
         ============================================ -->
    <script>
        (function() {
            const glow = document.getElementById('cursorGlow');
            
            let mouseX = 0;
            let mouseY = 0;
            let glowX = 0;
            let glowY = 0;
            
            // Very slow follow for dreamy effect
            const lerp = 0.04;
            
            document.addEventListener('mousemove', (e) => {
                mouseX = e.clientX;
                mouseY = e.clientY;
            });
            
            function animate() {
                glowX += (mouseX - glowX) * lerp;
                glowY += (mouseY - glowY) * lerp;
                
                glow.style.transform = `translate3d(${glowX}px, ${glowY}px, 0)`;
                
                requestAnimationFrame(animate);
            }
            
            animate();
        })();
    </script>
    
    <!-- ============================================
         GSAP SCROLL ANIMATIONS
         ============================================ -->
    <script>
        gsap.registerPlugin(ScrollTrigger);
        
        gsap.utils.toArray('.animate-fade-up').forEach((el, i) => {
            gsap.from(el, {
                scrollTrigger: {
                    trigger: el,
                    start: 'top 88%',
                    toggleActions: 'play none none none',
                },
                y: 30,
                opacity: 0,
                duration: 0.8,
                delay: i * 0.05,
                ease: 'power2.out',
            });
        });
        
        gsap.utils.toArray('.animate-stagger').forEach(parent => {
            gsap.from(parent.children, {
                scrollTrigger: {
                    trigger: parent,
                    start: 'top 85%',
                },
                y: 24,
                opacity: 0,
                duration: 0.7,
                stagger: 0.1,
                ease: 'power2.out',
            });
        });
    </script>
    
    {% block extra_js %}{% endblock %}
</body>
</html>
